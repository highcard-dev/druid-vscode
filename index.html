<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VS Code Web</title>
    <link rel="stylesheet" href="./out/vs/workbench/workbench.web.main.css" />
  </head>
  <body style="margin: 0; height: 100vh">
    <div id="root" style="height: 100vh; width: 100vw"></div>
    <script src="./out/nls.messages.js"></script>
    <script src="./out/vs/loader.js"></script>
    <script>
      function getJwtExpiration(token) {
        console.log("Auth: Parsing JWT token for expiration");
        try {
          const payload = JSON.parse(atob(token.split(".")[1]));
          const expiration = payload.exp;
          const currentTime = Math.floor(Date.now() / 1000);
          const timeUntilExpiry = expiration - currentTime;
          console.log(
            "Auth: JWT token expires at:",
            new Date(expiration * 1000).toISOString(),
            "Time until expiry (seconds):",
            timeUntilExpiry
          );
          return expiration;
        } catch (error) {
          console.error(
            "Auth: Failed to parse JWT token - invalid format or structure"
          );
          return 0;
        }
      }

      function getCookie(name) {
        console.log("Auth: Retrieving cookie:", name);
        const value = "; " + document.cookie;
        const parts = value.split("; " + name + "=");

        if (parts.length == 2) {
          const cookieValue = parts.pop()?.split(";").shift();
          console.log(
            "Auth: Cookie found:",
            name,
            "Length:",
            cookieValue?.length || 0
          );
          return cookieValue;
        }
        console.log("Auth: Cookie not found:", name);
        return null;
      }

      // Helper function to safely log objects without sensitive data
      function logSafeCredentials(creds) {
        return {
          hasApikey: !!creds.apikey,
          hasAccessToken: !!creds.accessToken,
          hasRefreshToken: !!creds.refreshToken,
          hasWebDavUrl: !!creds.webDavUrl,
          hasPathPrefix: !!creds.pathPrefix,
        };
      }

      const message = new MessageChannel();

      const messagePorts = new Map();

      messagePorts.set("druid.drd-fs", message.port2);

      // Configure loader with base URL only
      require.config({
        baseUrl: window.location.origin + "/out",
        colorScheme: "dark",
      });
      require(["vs/workbench/workbench.web.main"], (workbench) => {
        workbench.create(document.getElementById("root"), {
          productConfiguration: {
            extensionEnabledApiProposals: {
              "druid.drd-fs": [
                "fileSearchProvider",
                "textSearchProvider",
                "ipc",
              ],
            },
            nameShort: "Druid Web Editor",
            nameLong: "Druid Web Editor",
            applicationName: "code-web",
            dataFolderName: ".vscode-web",
            extensionsGallery: {
              serviceUrl: "https://open-vsx.org/vscode/gallery",
              itemUrl: "https://open-vsx.org/vscode/item",
              resourceUrlTemplate:
                "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
            },
          },
          folderUri: {
            scheme: "memfs",
            path: "/",
          },

          initialColorTheme: {
            themeType: "dark",
          },
          additionalBuiltinExtensions: [
            {
              scheme: window.location.protocol === "http:" ? "http" : "https",
              authority: window.location.host,
              path: "/extensions/webdav-fsprovider",
            },
          ],
          messagePorts,
        });

        message.port1.onmessage = (event) => {
          console.log(
            "Auth: Main received message type:",
            event.data?.type || "unknown"
          );
          const credentialsData = getCookie("vscode-workbench-web-secrets");
          if (!credentialsData) {
            console.error("Auth: No credentials found in cookie");
            return;
          }

          let credentials;
          try {
            credentials = JSON.parse(credentialsData);
            console.log(
              "Auth: Credentials parsed successfully. Has refresh token:",
              !!credentials.refreshToken
            );
            console.log(
              "Auth: WebDAV URL configured:",
              !!credentials.webDavUrl
            );
            console.log(
              "Auth: Path prefix configured:",
              !!credentials.pathPrefix
            );
          } catch (error) {
            console.error("Auth: Failed to parse credentials:", error);
            return;
          }

          const updateCredentials = (c) => {
            console.log("Auth: Updating credentials");
            message.port1.postMessage({
              type: "setCredentials",
              payload: {
                apikey: c.apikey,
                accessToken: c.accessToken,
                webdavUrl: c.webDavUrl,
                pathPrefix: c.pathPrefix,
              },
            });
            console.log("Auth: Credentials sent to extension");

            if (c.refreshToken) {
              console.log("Auth: Setting up token refresh mechanism");
              const exp = getJwtExpiration(c.accessToken);
              const currentTime = Math.floor(Date.now() / 1000);
              const timeUntilRefresh = Math.max(
                0,
                (exp - currentTime - 60) * 1000
              );

              console.log(
                "Auth: Token refresh scheduled in",
                timeUntilRefresh / 1000,
                "seconds"
              );

              setTimeout(async () => {
                console.log("Auth: Starting token refresh");
                try {
                  const response = await fetch(
                    "https://auth.druid.gg/v1/refresh",
                    {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                      },
                      body: JSON.stringify({ token: c.refreshToken }),
                    }
                  );

                  console.log(
                    "Auth: Token refresh response status:",
                    response.status
                  );

                  if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                  }

                  const refreshData = await response.json();
                  console.log("Auth: Token refresh successful");
                  updateCredentials({
                    ...credentials,
                    accessToken: refreshData.accessToken,
                    refreshToken: refreshData.refreshToken,
                  });
                } catch (error) {
                  console.error("Auth: Failed to refresh token:", error);
                  // Could potentially redirect to login or show error message
                }
              }, timeUntilRefresh);
            } else {
              console.log(
                "Auth: No refresh token available, refresh mechanism not set up"
              );
            }
          };
          updateCredentials(credentials);
          console.log("Auth: Initial credentials setup completed");
        };
      });
    </script>
  </body>
</html>
